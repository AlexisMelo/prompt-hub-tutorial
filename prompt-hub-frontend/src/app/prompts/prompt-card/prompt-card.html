<p-card class="mb-3">
  <div class="flex justify-content-between align-items-center mb-2">
    <div>
      <h3 class="m-0">{{ prompt().title }} par {{ prompt().author.username }}</h3>
      <div class="text-sm text-color-secondary">&#64;{{ prompt().author.username }}</div>
    </div>
    <div class="flex gap-2">
      <p-button
        icon="pi pi-pencil"
        size="small"
        [text]="true"
        [routerLink]="[prompt().id, 'edit']"
      />
      <p-button icon="pi pi-copy" (onClick)="copyToClipboard()" size="small" [text]="true" />
    </div>
  </div>
  <textarea pTextarea class="w-full mb-2" rows="8" readonly>{{ prompt().content }}</textarea>
  <div class="flex justify-content-between">
    <p-tag [value]="prompt().category.name" severity="secondary" />

    <div class="flex gap-2 align-items-center">
      <p-button icon="pi pi-thumbs-up" size="small" severity="secondary" />
      <span>{{ prompt().score }}</span>
      <p-button icon="pi pi-thumbs-down" size="small" severity="secondary" />
    </div>
  </div>
</p-card>
