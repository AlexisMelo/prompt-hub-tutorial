<p-card [header]="mode() === 'login' ? 'Connexion' : 'Créer un compte'">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="field">
      <label for="username">Nom d'utilisteur</label>
      <input class="w-full" formControlName="username" type="text" pInputText id="username" />
      <small class="invalid-feedback">Le nom d'utilisateur est requis</small>
    </div>
    <div class="field">
      <label for="password">Mot de passe</label>
      <p-password
        inputId="password"
        class="w-full"
        inputStyleClass="w-full"
        formControlName="password"
      ></p-password>
      <small class="invalid-feedback">Le mot de passe est requis (min 4 caractères)</small>
    </div>
    <div class="flex gap-2 justify-content-end">
      <p-button
        severity="secondary"
        (onClick)="toggleMode()"
        [label]="mode() === 'login' ? 'Créer un compte' : 'Se connecter'"
      ></p-button>
      <p-button
        type="submit"
        [label]="mode() === 'login' ? 'Connexion' : 'Créer le compte'"
      ></p-button>
    </div>
  </form>
</p-card>
